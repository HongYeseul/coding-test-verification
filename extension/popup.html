<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <span id="seal" class="seal" aria-hidden="true"></span>
      <strong>도장</strong>
    </header>

    <section id="signin" hidden>
      <p class="hint">처음 한 번만 로그인하면 됩니다.</p>
      <button id="signin-button" class="primary">GitHub로 로그인</button>
    </section>

    <section id="form" hidden>
      <label for="group">스터디</label>
      <select id="group"></select>

      <label for="title" id="title-label">문제 제목 <span class="hint">선택</span></label>
      <input id="title" maxlength="160" placeholder="예: 더 맵게" />

      <label for="tags">주제 태그 <span class="hint">쉼표로 구분 · 5개까지 · 선택</span></label>
      <input id="tags" placeholder="예: 해시, 정렬" />

      <p id="link" class="hint" hidden></p>

      <button id="submit" class="primary">이 화면으로 도장 찍기</button>

      <p id="repo" class="repo" hidden>
        <span>저장소</span>
        <a id="repo-link" target="_blank" rel="noopener"></a>
        <span id="repo-state" class="repo-state"></span>
        <button id="repo-disconnect" type="button" class="repo-disconnect">연결 끊기</button>
      </p>

    </section>

    <!-- 스터디가 없을 때도 다른 계정으로 바꿀 수 있게 폼 밖에 둡니다. -->
    <button id="signout" class="ghost" hidden>로그아웃</button>

    <p id="status" role="status" aria-live="polite"></p>
    <script src="seal.js"></script>
    <script type="module" src="popup.js"></script>
  </body>
</html>
