<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
    <title>도장 · GitHub 자동 올리기</title>
  </head>
  <body>
    <header>
      <span id="seal" class="seal" aria-hidden="true"></span>
      <strong>도장</strong>
    </header>
    <p class="hint">정답을 맞히면 선택한 GitHub 저장소에 풀이와 문제 설명을 자동으로 올립니다. NeetCode는 풀이만 올립니다.</p>
    <button id="connect" class="primary" hidden>GitHub로 로그인</button>
    <section id="settings" hidden>
      <label for="repo">공개 저장소</label>
      <select id="repo" disabled></select>
      <a id="repo-link" target="_blank" rel="noopener" hidden></a>
      <div id="create" hidden>
        <label for="repo-name">새 저장소 이름</label>
        <input id="repo-name" maxlength="100" placeholder="예: algorithms" />
        <button id="create-button" type="button">공개 저장소로 만들기</button>
      </div>
    </section>
    <button id="signout" class="ghost" hidden>로그아웃</button>
    <p id="status" role="status" aria-live="polite"></p>
    <script src="seal.js"></script>
    <script type="module" src="popup.js"></script>
  </body>
</html>
