<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <span id="seal" class="seal" aria-hidden="true"></span>
      <strong>도장</strong>
    </header>

    <section id="signin" hidden>
      <p class="hint">GitHub로 한 번 연결하면 다음부터 바로 찍힙니다.</p>
      <button id="signin-button" class="primary">GitHub로 연결</button>
    </section>

    <section id="form" hidden>
      <label for="group">스터디</label>
      <select id="group"></select>

      <label for="title" id="title-label">문제 제목 <span class="hint">선택</span></label>
      <input id="title" maxlength="160" placeholder="예: 더 맵게" />

      <label for="tags">주제 태그 <span class="hint">쉼표로 구분 · 선택</span></label>
      <input id="tags" placeholder="예: 해시, 정렬" />

      <p id="link" class="hint" hidden></p>

      <button id="submit" class="primary">지금 화면으로 도장 찍기</button>
      <button id="signout" class="ghost">연결 끊기</button>
    </section>

    <p id="status" role="status" aria-live="polite"></p>
    <script src="seal.js"></script>
    <script type="module" src="popup.js"></script>
  </body>
</html>
