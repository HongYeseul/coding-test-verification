<line x1="64" y1="924" x2="1016" y2="924" stroke="#e3e7ec" stroke-width="1"/>
<text x="64" y="970" font-size="12" fill="#1b2027" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace" font-weight="600" letter-spacing="0.08em">규칙</text>
<text x="236" y="970" font-size="13.5" fill="#1b2027" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-weight="600">색 하나가 두 일을 겸하지 않습니다</text>
<text x="236" y="992" font-size="12" fill="#69737e" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">예전에는 초록이 브랜드이면서 ‘승인’이었습니다. 도장판이 초록으로 차면 우리 색이라 그런 건지 다들 잘해서</text>
<text x="236" y="1010" font-size="12" fill="#69737e" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">그런 건지 구분되지 않았습니다.</text>
<text x="236" y="1048" font-size="13.5" fill="#1b2027" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-weight="600">brand와 primary는 다릅니다</text>
<text x="236" y="1070" font-size="12" fill="#69737e" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">brand는 바탕 위에 얹는 색이라 바탕과의 대비를 봅니다. primary는 채우는 면이라 그 위에 올라갈</text>
<text x="236" y="1088" font-size="12" fill="#69737e" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">글자와의 대비를 봅니다.</text>
<text x="236" y="1126" font-size="13.5" fill="#1b2027" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-weight="600">테마는 토큰 한 벌로 끝냅니다</text>
<text x="236" y="1148" font-size="12" fill="#69737e" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">light-dark()로 정의하므로 다크 모드용 재정의가 따로 없습니다. 사용자가 고른 테마는</text>
<text x="236" y="1166" font-size="12" fill="#69737e" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">color-scheme만 바꿉니다.</text>
</svg>
